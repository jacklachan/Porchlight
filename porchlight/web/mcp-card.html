<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porchlight card</title>
<!--
  MCP App for Porchlight tool results (served as ui://porchlight/card.html).
  Self-contained: no network requests, so it runs inside a host's sandboxed iframe.
  It speaks the MCP Apps postMessage protocol directly:
    app  -> host  ui/initialize, ui/notifications/initialized, ui/notifications/size-changed, tools/call
    host -> app   ui/notifications/tool-result
-->
<style>
  /* Sized for a smart display read from across a room: one title, one or two supporting lines,
     one clear action. Type steps up by 1.6, per the Alexa+ add-on design guidance. */
  :root { color-scheme: dark; --ink:#f3f5fa; --dim:#b4bed6; --panel:#1d2b49; --line:#34456b; --lamp:#f4ad3d; --good:#7fd1ae; --bad:#ff8f7c; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; background: transparent; color: var(--ink); font: 20px/1.4 "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; }
  h2 { font-size: 1.6em; line-height: 1.15; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  p { margin: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .body { padding: 18px 20px 20px; display: grid; gap: 12px; }
  .tone { height: 6px; background: var(--lamp); }
  .tone.urgent { background: var(--bad); } .tone.attention { background: #ff9a4a; } .tone.quiet { background: #8c9abb; }
  .dim { color: var(--dim); font-size: .8em; }
  img.frame { width: 100%; display: block; max-height: 300px; object-fit: cover; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li.row { display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
  .tag { font-size: .7em; padding: 3px 11px; border-radius: 999px; background: #2c3b62; color: #c3c8f5; white-space: nowrap; }
  .tag.good { background: #1f4a3d; color: var(--good); } .tag.warn { background: #5a2a25; color: var(--bad); } .tag.wait { background: #55431c; color: var(--lamp); }
  .step { border-left: 3px solid var(--line); padding-left: 12px; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  button { font: inherit; font-weight: 700; border-radius: 12px; padding: 12px 20px; min-height: 48px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  button.go { background: var(--good); border-color: var(--good); color: #0f2a22; }
  button:disabled { opacity: .5; cursor: progress; }
  button:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
</style>
</head>
<body>
<div id="root"><p class="dim">Waiting for Porchlight…</p></div>
<script>
(() => {
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const root = document.getElementById("root");
  let nextId = 1;
  const pending = new Map();

  function send(message) { window.parent.postMessage({ jsonrpc: "2.0", ...message }, "*"); }
  function request(method, params) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      send({ id, method, params });
    });
  }
  function notify(method, params) { send({ method, params }); }
  function reportSize() {
    notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight });
  }

  const STATE = {
    scheduled: ["Expected", ""], arrived: ["On the porch", "wait"], overdue_pickup: ["Still outside", "warn"],
    completed: ["Done", "good"], missed: ["Not seen", "warn"], cancelled: ["Cancelled", ""],
  };
  const checkIns = (items) => `<ul>${items.slice(0, 4).map((i) => {
    const [label, tone] = STATE[i.state] || [i.state, ""];
    return `<li class="row"><span>${esc(i.title)} <span class="dim">${esc(i.window)}</span></span><span class="tag ${tone}">${esc(label)}</span></li>`;
  }).join("")}</ul>`;
  const decide = (a) => `<div class="buttons"><button class="go" data-action="${esc(a.id)}" data-approve="1">Yes, go ahead</button>
    <button data-action="${esc(a.id)}" data-approve="0">Not now</button></div>`;
  const outcome = (a) => `${a.status[0].toUpperCase() + a.status.slice(1)}${a.decided_by ? ` by ${a.decided_by}` : ""}. ${a.result || ""}`;

  // Each card: a title, at most two supporting lines, and at most one decision.
  function render(result) {
    const data = result.structuredContent || {};
    const images = (result.content || []).filter((b) => b.type === "image").map((b) => `data:${b.mimeType};base64,${b.data}`);
    const text = (result.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
    let tone = "", title = "", lines = [], action = "", frames = images.slice(-1);

    if (data.card === "status") {
      tone = data.tone;
      const alert = (data.alerts || [])[0];
      const ask = (data.proposed_actions || []).find((a) => a.status === "proposed");
      title = data.headline;
      if (alert) lines.push(esc(alert.body));
      if (ask) {
        lines.push(`<b>${esc(ask.title)}?</b> <span class="dim">Nothing is sent until you choose.</span>`);
        action = decide(ask);
      } else if (alert) {
        action = `<div class="buttons"><button data-evidence="${esc(alert.id)}">Show me why</button></div>`;
      } else if (data.check_ins?.length) {
        lines.push(checkIns(data.check_ins));
      }
      lines.push(`<span class="dim">${esc(data.person_name)}'s front door, as of ${esc(data.as_of)}</span>`);
    } else if (data.card === "evidence") {
      title = `Why: ${data.title}`;
      const steps = (data.steps || []).filter((s) => s.rule).slice(-2);
      lines = steps.map((s) => `<div class="step"><b>${esc(s.at)}</b> ${esc(s.what)}. <span class="dim">${esc(s.rule)}</span></div>`);
      const seen = (data.observations || []).slice(-1)[0];
      if (seen) lines.push(`<span class="dim">Frame from ${esc(seen.at)}: ${esc(seen.summary)}</span>`);
    } else if (data.card === "frame") {
      const o = data.observation || {};
      title = o.status === "needs_review" ? "I am not sure what this shows" : o.summary;
      lines.push(`<span class="dim">The porch at ${esc(o.at)}${o.status === "needs_review" ? ". It is waiting for you on the dashboard." : ""}</span>`);
    } else if (data.card === "actions") {
      const items = data.proposed_actions || [];
      const ask = items.find((a) => a.status === "proposed");
      const shown = ask || items[0];
      title = shown ? shown.title : "Nothing is waiting for you";
      if (ask) {
        if (ask.detail) lines.push(esc(ask.detail));
        lines.push(`<span class="dim">Nothing is sent until you choose.</span>`);
        action = decide(ask);
      } else if (shown) {
        tone = shown.status === "approved" ? "" : "quiet";
        lines.push(esc(outcome(shown)));
      }
    } else if (data.card === "check_ins") {
      title = data.day ? `Expected ${data.day}` : "Check-ins";
      lines.push(data.check_ins?.length ? checkIns(data.check_ins) : `<span class="dim">Nothing.</span>`);
    } else if (data.card === "alerts") {
      const first = (data.alerts || [])[0];
      tone = first ? (first.level === "urgent" ? "urgent" : "attention") : "quiet";
      title = first ? first.title : "No open alerts";
      if (first) {
        lines.push(esc(first.body));
        action = `<div class="buttons"><button data-evidence="${esc(first.id)}">Show me why</button></div>`;
      }
    } else {
      tone = result.isError ? "urgent" : "quiet";
      title = data.message || text;
    }
    root.innerHTML = `<div class="card">${tone ? `<div class="tone ${esc(tone)}"></div>` : ""}
      ${frames.map((src) => `<img class="frame" src="${src}" alt="Frame from the doorbell camera">`).join("")}
      <div class="body"><h2>${esc(title)}</h2>${lines.map((l) => `<div>${l}</div>`).join("")}${action}</div></div>`;
    root.querySelectorAll("img").forEach((img) => img.addEventListener("load", reportSize));
    reportSize();
  }

  root.addEventListener("click", async (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    root.querySelectorAll("button").forEach((b) => (b.disabled = true));
    try {
      // decide_action is registered with visibility ["app"]: only this tap can reach it.
      const result = button.dataset.evidence
        ? await request("tools/call", { name: "get_evidence", arguments: { subject_id: button.dataset.evidence } })
        : await request("tools/call", {
            name: "decide_action",
            arguments: { action_id: button.dataset.action, approve: button.dataset.approve === "1" },
          });
      render(result);
    } catch (err) {
      root.querySelectorAll("button").forEach((b) => (b.disabled = false));
      root.insertAdjacentHTML("beforeend", `<p class="dim">That did not work: ${esc(err.message || err)}</p>`);
      reportSize();
    }
  });

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0" || event.source !== window.parent) return;
    if (msg.id !== undefined && pending.has(msg.id)) {
      const { resolve, reject } = pending.get(msg.id);
      pending.delete(msg.id);
      return msg.error ? reject(new Error(msg.error.message)) : resolve(msg.result);
    }
    if (msg.method === "ui/notifications/tool-result") render(msg.params);
  });

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "porchlight-card", version: "0.1.0" },
    appCapabilities: {},
  }).then(() => notify("ui/notifications/initialized", {}), () => {});
  new ResizeObserver(reportSize).observe(document.body);
})();
</script>
</body>
</html>
