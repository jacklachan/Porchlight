[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "porchlight"
version = "0.1.0"
description = "Care check-ins from the front door: a Ring app that verifies expected deliveries and visits for a relative living alone."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "mcp>=2.0",
    "pillow>=10",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
porchlight = "porchlight.__main__:main"

[tool.setuptools.packages.find]
include = ["porchlight*"]

[tool.setuptools.package-data]
porchlight = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
